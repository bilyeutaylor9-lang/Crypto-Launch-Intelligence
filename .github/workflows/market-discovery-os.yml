name: CLI 6-8 Market Discovery OS

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: market-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  market-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '^24.22.0'
          check-latest: true
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Restore Market Discovery And Alpha Memory
        id: legacy_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/market-discovery-predictions.jsonl
            data/market-discovery-dependencies.json
            data/market-regime-history.json
            data/research-value-accounting.jsonl
            data/alpha-os-predictions.jsonl
            data/alpha-os-candidate-history.json
            data/capital-migration-history.json
            data/project-digital-twins.json
            data/model-factory-challengers.json
            data/edge-production-episodes.jsonl
            data/edge-evidence-outcomes.jsonl
            data/edge-fast-outcomes.jsonl
            data/edge-candidate-universe.json
            data/ignition-twin-observations.jsonl
            data/ignition-genome-history.json
            data/production-shadow-predictions.jsonl
          key: market-discovery-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            market-discovery-${{ runner.os }}-${{ github.ref_name }}-
            alpha-os-${{ runner.os }}-${{ github.ref_name }}-
            production-shadow-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore Canonical Scanner State Bundle
        id: learning_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-v2-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-v2-${{ runner.os }}-

      - name: Prepare Legacy Scanner State Isolation
        id: legacy_state_prepare
        timeout-minutes: 12
        run: node src/ops/isolateLegacyScannerState.js prepare
        env:
          LEGACY_STATE_ISOLATION_DIR: ${{ runner.temp }}/legacy-state-isolation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          LEGACY_STATE_WORKFLOW_KIND: MARKET_DISCOVERY
          LEGACY_STATE_CACHE_KEY: ${{ steps.legacy_cache_restore.outputs.cache-matched-key }}
          CANONICAL_STATE_CACHE_KEY: ${{ steps.learning_cache_restore.outputs.cache-matched-key }}
          LEGACY_STATE_RESTORE_OUTCOME: ${{ steps.legacy_cache_restore.outcome }}
          CANONICAL_STATE_RESTORE_OUTCOME: ${{ steps.learning_cache_restore.outcome }}

      - name: Upload Temporary Legacy Scanner State Diagnostic
        id: legacy_state_upload
        if: ${{ success() && steps.legacy_state_prepare.outputs.needs_commit == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: temporary-legacy-scanner-state-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ runner.temp }}/legacy-state-isolation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/legacy-scanner-state.tar.gz
            ${{ runner.temp }}/legacy-state-isolation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/manifest.json
            ${{ runner.temp }}/legacy-state-isolation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/preservation-receipt.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit Verified Legacy Scanner State Isolation
        id: legacy_state_commit
        if: ${{ success() && steps.legacy_state_prepare.outputs.needs_commit == 'true' && steps.legacy_state_upload.outcome == 'success' }}
        run: node src/ops/isolateLegacyScannerState.js commit
        env:
          LEGACY_STATE_ISOLATION_DIR: ${{ runner.temp }}/legacy-state-isolation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          LEGACY_STATE_WORKFLOW_KIND: MARKET_DISCOVERY
          LEGACY_STATE_CACHE_KEY: ${{ steps.legacy_cache_restore.outputs.cache-matched-key }}
          CANONICAL_STATE_CACHE_KEY: ${{ steps.learning_cache_restore.outputs.cache-matched-key }}
          LEGACY_STATE_RESTORE_OUTCOME: ${{ steps.legacy_cache_restore.outcome }}
          CANONICAL_STATE_RESTORE_OUTCOME: ${{ steps.learning_cache_restore.outcome }}
          LEGACY_STATE_PLAN_HASH: ${{ steps.legacy_state_prepare.outputs.plan_hash }}
          LEGACY_STATE_UPLOAD_OUTCOME: ${{ steps.legacy_state_upload.outcome }}

      - name: Restore Validated Scanner State
        if: ${{ success() && steps.legacy_state_prepare.outcome == 'success' && (steps.legacy_state_prepare.outputs.needs_commit == 'false' || steps.legacy_state_commit.outcome == 'success') }}
        run: npm run state:restore

      - name: Restore Remote Operational Circuit
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: data/remote-operational-circuits.json
          key: remote-operational-circuit-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            remote-operational-circuit-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore Append-Only Forward Evidence
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            forward-evidence-${{ runner.os }}-${{ github.ref_name }}-
            forward-evidence-${{ runner.os }}-

      - name: Restore Durable Forward Evidence
        run: npm run forward:evidence:restore
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Refresh CLI 5 Alpha OS
        run: npm run alpha:os

      - name: Run CLI 6-8 Market Discovery
        run: npm run market:discover

      - name: Learn From Mature Market Discovery Outcomes
        run: npm run market:learn

      - name: Save Market Discovery Memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/market-discovery-predictions.jsonl
            data/market-discovery-dependencies.json
            data/market-regime-history.json
            data/research-value-accounting.jsonl
            data/alpha-os-predictions.jsonl
            data/alpha-os-candidate-history.json
            data/capital-migration-history.json
            data/project-digital-twins.json
            data/model-factory-challengers.json
          key: market-discovery-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Market Discovery Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-discovery-${{ github.run_id }}
          path: |
            reports/market-discovery-engine.json
            reports/market-discovery-resolved.json
            reports/market-discovery-lead-time.json
            reports/earliest-cause-analysis.json
            reports/evidence-value-accounting.json
          if-no-files-found: warn
          retention-days: 60

      - name: Save Remote Operational Circuit
        if: ${{ always() && hashFiles('data/remote-operational-circuits.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: data/remote-operational-circuits.json
          key: remote-operational-circuit-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
