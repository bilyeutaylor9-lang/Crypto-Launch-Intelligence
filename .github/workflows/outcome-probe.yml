name: Exact Outcome Probe

on:
  workflow_dispatch:
    inputs:
      export_forward_cache:
        description: Export a selected preserved forward-evidence cache without probing
        type: boolean
        required: false
        default: false
      exact_source_cache_key:
        description: Optional exact forward-evidence cache key; otherwise restore only the main prefix
        type: string
        required: false
        default: ""
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: read

concurrency:
  group: live-dashboard-scan-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  probe:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.export_forward_cache != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '^24.22.0'
          check-latest: true

      - name: Install Dependencies
        run: npm ci

      - name: Restore Bounded Learning Memory
        id: learning_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-v2-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-v2-${{ runner.os }}-

      - name: Restore Validated Scanner State
        run: npm run state:restore

      - name: Restore Remote Operational Circuit
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: data/remote-operational-circuits.json
          key: remote-operational-circuit-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            remote-operational-circuit-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore Append-Only Forward Evidence
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            forward-evidence-${{ runner.os }}-${{ github.ref_name }}-
            forward-evidence-${{ runner.os }}-

      - name: Restore Durable Forward Evidence
        run: npm run forward:evidence:restore
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Probe Due Exact Outcomes
        id: outcome_probe
        run: npm run outcomes:probe
        env:
          OUTCOME_PROBE_HORIZONS: 1,24,168,720
          OUTCOME_PROBE_MAX_CANDIDATES: 120
          OUTCOME_PROBE_MAX_REQUESTS: 120
          OUTCOME_PROBE_CONCURRENCY: 4

      - name: Save Append-Only Forward Evidence
        if: ${{ always() && (hashFiles('data/production-market-observations.jsonl') != '' || hashFiles('data/market-context-observations.jsonl') != '' || hashFiles('data/prospective-edge-cohorts.jsonl') != '') }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Sync Durable Forward Evidence
        if: always()
        run: npm run forward:evidence:sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Save Bounded Learning Memory
        if: always()
        id: state_pack
        continue-on-error: true
        run: npm run state:pack -- --require-exact-universe

      - name: Save Canonical Scanner State Bundle
        if: steps.state_pack.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Probe Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outcome-probe-${{ github.run_id }}
          path: reports/outcome-probe.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Remote Operational Circuit
        if: ${{ always() && hashFiles('data/remote-operational-circuits.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: data/remote-operational-circuits.json
          key: remote-operational-circuit-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  export-forward-cache:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_forward_cache == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '^24.22.0'
          check-latest: true

      - name: Restore Exact Selected Forward Evidence Cache
        id: exact_forward_cache
        if: ${{ inputs.exact_source_cache_key != '' }}
        uses: actions/cache/restore@v5
        with:
          path: |-
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: ${{ inputs.exact_source_cache_key }}

      - name: Restore Main Forward Evidence Cache Prefix
        id: main_forward_cache
        if: ${{ inputs.exact_source_cache_key == '' }}
        uses: actions/cache/restore@v5
        with:
          path: |-
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-main-export-only
          restore-keys: |
            forward-evidence-${{ runner.os }}-main-

      - name: Export Preserved Forward Evidence Cache
        id: export_cache
        env:
          FORWARD_CACHE_EXPORT_DIR: ${{ runner.temp }}/forward-evidence-cache-export
          FORWARD_CACHE_SOURCE_KEY: ${{ inputs.exact_source_cache_key }}
          FORWARD_CACHE_MATCHED_KEY: ${{ inputs.exact_source_cache_key != '' && steps.exact_forward_cache.outputs.cache-matched-key || steps.main_forward_cache.outputs.cache-matched-key }}
          FORWARD_CACHE_HIT: ${{ inputs.exact_source_cache_key != '' && steps.exact_forward_cache.outputs.cache-hit || steps.main_forward_cache.outputs.cache-hit }}
        run: node src/ops/exportForwardEvidenceCache.js

      - name: Upload Forward Evidence Cache Export
        if: ${{ success() && steps.export_cache.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: forward-evidence-cache-export-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/forward-evidence-cache-export/forward-evidence-cache.tar.gz
            ${{ runner.temp }}/forward-evidence-cache-export/manifest.json
            ${{ runner.temp }}/forward-evidence-cache-export/export-receipt.json
          if-no-files-found: error
          retention-days: 1
