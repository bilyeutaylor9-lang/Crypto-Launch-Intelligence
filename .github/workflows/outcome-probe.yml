name: Exact Outcome Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: read

concurrency:
  group: live-dashboard-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore Bounded Learning Memory
        id: learning_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/*memory*.json*
            data/scan-history.json*
            data/market-opportunity-learning.json*
            data/outcome-snapshots.json*
            data/point-in-time-observations.json*
            data/project-observations.jsonl
            data/project-watchlist.json*
            data/research-coverage-ledger.json*
            data/source-router-memory.json*
            data/universe-ledger.json*
            data/watchtower-*.json*
            data/edge-production-episodes.jsonl
            data/edge-evidence-outcomes.jsonl
            data/committed-loaded-vacuum-observations.jsonl
            data/capital-commitment-episodes.jsonl
            data/capital-path-learning-observations.jsonl
            data/chain-capital-radar-observations.jsonl
            data/edge-candidate-universe.json
            data/prospective-entry-edge-episodes.jsonl
            data/asymmetric-edge-observations.jsonl
            data/asymmetric-edge-outcomes.json*
            data/three-clock-edge-observations.jsonl
            data/wallet-temporal-fingerprints.jsonl
            data/ignition-twin-observations.jsonl
            data/committed-loaded-vacuum-replication-plan.json
            data/ignition-executable-edge-canary-replays.jsonl
            data/ignition-executable-edge-canary-tickets.jsonl
            data/ignition-executable-edge-canary-policy.json
            data/native-discovery/raw-events.json
            data/native-discovery/confirmed-events.json
            data/native-discovery/checkpoints.json
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-${{ runner.os }}-

      - name: Restore Append-Only Forward Evidence
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            forward-evidence-${{ runner.os }}-${{ github.ref_name }}-
            forward-evidence-${{ runner.os }}-

      - name: Probe Due Exact Outcomes
        id: outcome_probe
        run: npm run outcomes:probe
        env:
          OUTCOME_PROBE_HORIZONS: 1,24,168,720
          OUTCOME_PROBE_MAX_CANDIDATES: 120
          OUTCOME_PROBE_MAX_REQUESTS: 120
          OUTCOME_PROBE_CONCURRENCY: 4

      - name: Save Append-Only Forward Evidence
        if: ${{ always() && (hashFiles('data/production-market-observations.jsonl') != '' || hashFiles('data/prospective-edge-cohorts.jsonl') != '') }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save Bounded Learning Memory
        if: ${{ always() && hashFiles('data/edge-candidate-universe.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/*memory*.json*
            data/scan-history.json*
            data/market-opportunity-learning.json*
            data/outcome-snapshots.json*
            data/point-in-time-observations.json*
            data/project-observations.jsonl
            data/project-watchlist.json*
            data/research-coverage-ledger.json*
            data/source-router-memory.json*
            data/universe-ledger.json*
            data/watchtower-*.json*
            data/edge-production-episodes.jsonl
            data/edge-evidence-outcomes.jsonl
            data/committed-loaded-vacuum-observations.jsonl
            data/capital-commitment-episodes.jsonl
            data/capital-path-learning-observations.jsonl
            data/chain-capital-radar-observations.jsonl
            data/edge-candidate-universe.json
            data/prospective-entry-edge-episodes.jsonl
            data/asymmetric-edge-observations.jsonl
            data/asymmetric-edge-outcomes.json*
            data/three-clock-edge-observations.jsonl
            data/wallet-temporal-fingerprints.jsonl
            data/ignition-twin-observations.jsonl
            data/committed-loaded-vacuum-replication-plan.json
            data/ignition-executable-edge-canary-replays.jsonl
            data/ignition-executable-edge-canary-tickets.jsonl
            data/ignition-executable-edge-canary-policy.json
            data/native-discovery/raw-events.json
            data/native-discovery/confirmed-events.json
            data/native-discovery/checkpoints.json
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Probe Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outcome-probe-${{ github.run_id }}
          path: reports/outcome-probe.json
          if-no-files-found: ignore
          retention-days: 14
