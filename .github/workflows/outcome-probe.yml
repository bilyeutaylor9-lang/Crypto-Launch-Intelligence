name: Exact Outcome Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"
  workflow_run:
    workflows: ["Edge Fast Evidence"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: exact-outcome-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Restore Bounded Learning Memory
        id: learning_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-${{ runner.os }}-

      - name: Restore Validated Scanner State
        run: npm run state:restore

      - name: Restore Append-Only Forward Evidence
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            forward-evidence-${{ runner.os }}-${{ github.ref_name }}-
            forward-evidence-${{ runner.os }}-

      - name: Restore Durable Forward Evidence
        id: forward_evidence_restore
        run: npm run forward:evidence:restore
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Probe Due Exact Outcomes
        id: outcome_probe
        run: npm run outcomes:probe
        env:
          OUTCOME_PROBE_HORIZONS: 1,24,168,720
          OUTCOME_PROBE_MAX_CANDIDATES: 120
          OUTCOME_PROBE_MAX_REQUESTS: 120
          OUTCOME_PROBE_CONCURRENCY: 4

      - name: Save Append-Only Forward Evidence
        if: ${{ always() && (hashFiles('data/production-market-observations.jsonl') != '' || hashFiles('data/market-context-observations.jsonl') != '' || hashFiles('data/prospective-edge-cohorts.jsonl') != '') }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Sync Durable Forward Evidence
        if: always()
        id: forward_evidence_sync
        run: npm run forward:evidence:sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Verify Durable Outcome Evidence
        if: always()
        id: forward_evidence_verify
        run: npm run forward:evidence:verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Build Outcome Collection Health Report
        if: always()
        id: outcome_collection_health
        run: npm run outcomes:health
        env:
          OUTCOME_COLLECTION_MAX_AGE_MINUTES: 180
          OUTCOME_PROBE_STEP_OUTCOME: ${{ steps.outcome_probe.outcome }}
          FORWARD_EVIDENCE_RESTORE_STEP_OUTCOME: ${{ steps.forward_evidence_restore.outcome }}
          FORWARD_EVIDENCE_SYNC_STEP_OUTCOME: ${{ steps.forward_evidence_sync.outcome }}
          FORWARD_EVIDENCE_VERIFY_STEP_OUTCOME: ${{ steps.forward_evidence_verify.outcome }}

      - name: Save Bounded Learning Memory
        if: always()
        id: state_pack
        continue-on-error: true
        run: npm run state:pack -- --require-exact-universe

      - name: Save Canonical Scanner State Bundle
        if: steps.state_pack.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Probe Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outcome-probe-${{ github.run_id }}
          path: |
            reports/outcome-probe.json
            reports/outcome-collection-health.json
            reports/forward-evidence-restore.json
            reports/forward-evidence-sync.json
            reports/forward-evidence-verify.json
          if-no-files-found: ignore
          retention-days: 14
