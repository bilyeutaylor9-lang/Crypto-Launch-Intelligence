name: Production Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Syntax And Production Tests
        run: |
          npm run typecheck
          npm run lint
          npm run test:production-platform
          npm run test:alpha-os
          npm run test:market-discovery
          npm run test:future-intelligence
          npm run test:cli15
          npm run test:edge-adaptive

      - name: Existing Provider And Backtest Integrity
        run: |
          npm run test:providers
          npm run test:core-backtest

      - name: Verify Production Shadow Fails Closed Without Live Universe
        run: |
          set +e
          npm run production:shadow
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Expected the isolated verification runner to reject its unavailable live universe; got exit $status."
            exit 1
          fi
          node --input-type=module -e 'import fs from "node:fs"; const report = JSON.parse(fs.readFileSync("reports/production-shadow-ranking.json", "utf8")); if (report.state !== "PRODUCTION_SHADOW_BLOCKED_UNIVERSE_PRECONDITION" || !report.universePreflight?.blockers?.includes("EDGE_CANDIDATE_UNIVERSE_UNAVAILABLE")) process.exit(1);'

      - name: Data Source Readiness
        continue-on-error: true
        run: npm run sources:readiness

      - name: Grade Mature Shadow Evidence
        run: npm run production:grade

      - name: CLI 2.0 Autonomous Alpha Lab
        run: npm run alpha:lab

      - name: CLI 3.0-14.0 Research Stack
        run: |
          npm run alpha:os
          npm run market:discover
          npm run future:intelligence

      - name: CLI 15.0 Forward Alpha Validation OS
        run: npm run cli15:validate

      - name: CLI 1.0 Forward Edge Verification
        continue-on-error: true
        run: npm run edge:verify

      - name: Security Audit
        run: npm run production:security

      - name: Operational Audits
        continue-on-error: true
        run: npm run production:ops-audit

      - name: Production Readiness
        continue-on-error: true
        run: npm run production:readiness

      - name: Upload Verification Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-verification-${{ github.run_id }}
          path: |
            reports/live-environment-audit.json
            reports/data-source-readiness.json
            reports/backup-restore-audit.json
            reports/fault-injection-audit.json
            reports/exact-identity-health.json
            reports/outcome-capture-health.json
            reports/reproducibility-audit.json
            reports/production-shadow-ranking.json
            reports/prospective-proof-acquisition.json
            reports/prospective-edge-cohort-capture.json
            reports/prospective-edge-cohort-grade.json
            reports/production-observability.json
            reports/production-readiness.json
            reports/autonomous-alpha-challengers.json
            reports/autonomous-alpha-lab.json
            reports/edge-verification-certificate.json
            reports/edge-verification-program.json
            reports/edge-verification-posthoc-diagnostic.json
            reports/production-security-audit.json
            reports/remote-backup-attestation.json
            reports/remote-persistence-audit.json
            reports/missed-winner-autopsy-production.json
            reports/champion-challenger.json
            reports/research-hypothesis-evidence.json
            reports/production-counterfactual-edge.json
            reports/production-edge-decay.json
            reports/production-calibration.json
            reports/production-shadow-resolved.json
            reports/future-intelligence-stack.json
            reports/realtime-market-nervous-system.json
            reports/market-microstructure-brain.json
            reports/economic-entity-graph-v2.json
            reports/cross-market-intelligence.json
            reports/liquidity-weather-forecast.json
            reports/capital-destination-v2.json
            reports/self-optimizing-research.json
            reports/alpha-memory-graph.json
            reports/market-thesis.json
            reports/forward-alpha-validation-os.json
            reports/cli15-promotion-gate.json
            reports/cli15-multi-horizon-evidence.json
          if-no-files-found: warn
          retention-days: 30
