name: Shadow Universe Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: read

concurrency:
  group: live-dashboard-scan-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '^24.22.0'
          check-latest: true
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Restore Canonical Scanner State Bundle
        id: learning_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-v2-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-v2-${{ runner.os }}-

      - name: Restore Validated Scanner State
        run: npm run state:restore

      - name: Restore Remote Operational Circuit
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: data/remote-operational-circuits.json
          key: remote-operational-circuit-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            remote-operational-circuit-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Refresh Exact Candidate Universe
        run: npm run scan:debug100

      - name: Enforce Fresh Exact Shadow Universe
        run: npm run operations:truth -- --scope shadow-universe

      - name: Pack Canonical Scanner State Bundle
        id: state_pack
        run: npm run state:pack -- --require-exact-universe

      - name: Save Canonical Scanner State Bundle
        id: state_cache_save
        uses: actions/cache/save@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Preserve Failed Scanner State Diagnostic
        id: failed_state_preserve
        if: ${{ always() && (steps.state_pack.outcome != 'success' || steps.state_cache_save.outcome != 'success') }}
        continue-on-error: true
        timeout-minutes: 12
        run: node src/ops/preserveFailedScannerState.js
        env:
          FAILED_SCANNER_STATE_DIR: ${{ runner.temp }}/failed-scanner-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          SCANNER_STATE_PACK_OUTCOME: ${{ steps.state_pack.outcome }}
          SCANNER_STATE_CACHE_SAVE_OUTCOME: ${{ steps.state_cache_save.outcome }}
          SCANNER_STATE_EXPECTED_CACHE_KEY: scanner-learning-v2-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          SCANNER_STATE_MATCHED_RESTORE_CACHE_KEY: ${{ steps.learning_cache_restore.outputs.cache-matched-key }}
          SCANNER_STATE_RESTORE_OUTCOME: ${{ steps.learning_cache_restore.outcome }}

      - name: Upload Temporary Failed Scanner State Diagnostic
        id: failed_state_upload
        if: ${{ always() && steps.failed_state_preserve.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: temporary-failed-scanner-state-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: |
            ${{ runner.temp }}/failed-scanner-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/failed-scanner-state.tar.gz
            ${{ runner.temp }}/failed-scanner-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/manifest.json
            ${{ runner.temp }}/failed-scanner-state-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/preservation-receipt.json
          if-no-files-found: error
          retention-days: 1

      - name: Enforce Scanner State Persistence
        id: state_persistence
        if: always()
        env:
          STATE_PACK: ${{ steps.state_pack.outcome }}
          STATE_CACHE_SAVE: ${{ steps.state_cache_save.outcome }}
          FAILED_STATE_PRESERVE: ${{ steps.failed_state_preserve.outcome }}
          FAILED_STATE_UPLOAD: ${{ steps.failed_state_upload.outcome }}
        run: |
          failed=0
          if [ "$STATE_PACK" != "success" ]; then
            echo "::error::STATE_PACK finished with $STATE_PACK; a temporary diagnostic cannot replace canonical restart state."
            failed=1
          fi
          if [ "$STATE_PACK" != "success" ] || [ "$STATE_CACHE_SAVE" != "success" ]; then
            if [ "$FAILED_STATE_PRESERVE" != "success" ] || [ "$FAILED_STATE_UPLOAD" != "success" ]; then
              echo "::error::Scanner state persistence failed: canonical cache=$STATE_CACHE_SAVE, diagnostic preservation=$FAILED_STATE_PRESERVE, diagnostic upload=$FAILED_STATE_UPLOAD."
              failed=1
            else
              echo "::warning::Canonical scanner state persistence was incomplete; raw bytes were uploaded only as a temporary 1-day diagnostic, not a permanent backup or verified restart."
            fi
          fi
          exit "$failed"

      - name: Save Remote Operational Circuit
        if: ${{ always() && hashFiles('data/remote-operational-circuits.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: data/remote-operational-circuits.json
          key: remote-operational-circuit-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
