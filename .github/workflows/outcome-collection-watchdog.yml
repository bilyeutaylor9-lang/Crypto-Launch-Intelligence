name: Outcome Collection Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "5,35 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: outcome-collection-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Fail On Stale Outcome Collection
        run: npm run outcomes:watchdog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTCOME_PROBE_BRANCH: main
          OUTCOME_PROBE_MAX_AGE_MINUTES: 180

      - name: Upload Outcome Collection Watchdog Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outcome-collection-watchdog-${{ github.run_id }}
          path: reports/outcome-collection-watchdog.json
          if-no-files-found: error
          retention-days: 30
