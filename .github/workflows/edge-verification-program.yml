name: CLI 1.0 Edge Verification + CLI 2.0 Alpha Lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: edge-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-forward-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Restore Learning And Experiment Memory
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/edge-production-episodes.jsonl
            data/edge-evidence-outcomes.jsonl
            data/outcome-snapshots.json
            data/ignition-twin-observations.jsonl
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-${{ runner.os }}-

      - name: Restore Production Shadow Memory
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/production-shadow-predictions.jsonl
          key: production-shadow-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            production-shadow-${{ runner.os }}-${{ github.ref_name }}-
            production-shadow-${{ runner.os }}-

      - name: Restore Autonomous Alpha Memory
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/autonomous-alpha-experiments.json
          key: autonomous-alpha-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            autonomous-alpha-${{ runner.os }}-${{ github.ref_name }}-
            autonomous-alpha-${{ runner.os }}-

      - name: Restore Append-Only Forward Evidence
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            forward-evidence-${{ runner.os }}-${{ github.ref_name }}-
            forward-evidence-${{ runner.os }}-

      - name: Grade Mature Shadow Outcomes
        run: npm run production:grade

      - name: Verify Forward Edge
        continue-on-error: true
        run: npm run edge:verify

      - name: Run Autonomous Alpha Lab
        run: npm run alpha:lab

      - name: Save Experiment Memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/autonomous-alpha-experiments.json
          key: autonomous-alpha-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Edge Verification Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edge-verification-${{ github.run_id }}
          path: |
            reports/edge-verification-program.json
            reports/edge-verification-certificate.json
            reports/edge-verification-posthoc-diagnostic.json
            reports/prospective-edge-cohort-grade.json
            reports/autonomous-alpha-lab.json
            reports/autonomous-alpha-challengers.json
          if-no-files-found: warn
          retention-days: 60
