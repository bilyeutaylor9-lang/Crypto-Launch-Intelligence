name: Edge Evidence Truth

on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"

permissions:
  contents: read

concurrency:
  group: live-dashboard-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Restore Bounded Edge Evidence Memory
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-${{ runner.os }}-

      - name: Restore Validated Scanner State
        run: npm run state:restore

      - name: Restore Append-Only Forward Evidence
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            forward-evidence-${{ runner.os }}-${{ github.ref_name }}-
            forward-evidence-${{ runner.os }}-

      - name: Restore Durable Forward Evidence
        run: npm run forward:evidence:restore
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Probe Due Frozen Treatment And Control Outcomes
        id: edge_evidence_probe
        continue-on-error: true
        run: npm run edge:evidence:probe
        env:
          EDGE_EVIDENCE_MAX_REQUESTS: 60
          EDGE_EVIDENCE_CONCURRENCY: 4

      - name: Observe Continuous Capital And Refresh Shadow Models
        id: edge_acquisition
        continue-on-error: true
        run: npm run edge:acquire
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          IGNITION_CAPITAL_RADAR_LOOKBACK_MINUTES: 70
          IGNITION_CAPITAL_RADAR_MAX_LOOKBACK_BLOCKS: 2400
          IGNITION_CAPITAL_RADAR_CONTINUITY_MAX_LOOKBACK_BLOCKS: 12000
          IGNITION_CAPITAL_RADAR_MAX_LOGS: 50000
          IGNITION_CAPITAL_RADAR_MAX_WALLETS: 120
          IGNITION_CAPITAL_RADAR_MAX_TRACKED_WALLETS: 160
          IGNITION_CAPITAL_RADAR_MIN_TRANSFER_USD: 5000

      - name: Validate Acquisition Health
        id: acquisition_health
        if: always()
        continue-on-error: true
        env:
          EDGE_ACQUISITION_STEP_OUTCOME: ${{ steps.edge_acquisition.outcome }}
          EDGE_ACQUISITION_MAX_REPORT_AGE_MINUTES: 30
        run: npm run edge:acquisition:health

      - name: Refresh Evidence Health And Research Loop
        if: always()
        run: npm run edge:evidence:truth

      - name: Refresh Adaptive Edge Learning
        if: always()
        run: npm run edge:learn:adaptive

      - name: Refresh Ignition Genome
        if: always()
        run: npm run ignition:genome

      - name: Synthesize Research Priority
        if: always()
        run: npm run edge:research:synthesis

      - name: Save Bounded Edge Evidence Memory
        if: always()
        id: state_pack
        continue-on-error: true
        run: npm run state:pack -- --require-exact-universe

      - name: Save Canonical Scanner State Bundle
        if: steps.state_pack.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Sync Durable Forward Evidence
        if: always()
        id: forward_evidence_sync
        continue-on-error: true
        run: npm run forward:evidence:sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}

      - name: Save Append-Only Forward Evidence
        if: ${{ always() && (hashFiles('data/production-market-observations.jsonl') != '' || hashFiles('data/market-context-observations.jsonl') != '' || hashFiles('data/prospective-edge-cohorts.jsonl') != '') }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Enforce Acquisition Operational Truth
        if: always()
        id: operational_truth
        continue-on-error: true
        run: npm run operations:truth -- --scope edge-truth

      - name: Upload Edge Evidence Truth Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edge-evidence-truth-${{ github.run_id }}
          path: |
            reports/edge-evidence-probe.json
            reports/edge-evidence-health.json
            reports/edge-evidence-outcome-lab.json
            reports/avoidance-edge-verification.json
            reports/edge-failure-autopsy.json
            reports/edge-mechanism-contrast.json
            reports/edge-evidence-discovery-loop.json
            reports/edge-research-autopilot.json
            reports/prospective-entry-edge.json
            reports/edge-acquisition-cycle.json
            reports/acquisition-health-gate.json
            reports/edge-opportunity-synthesis.json
            reports/ignition-genome.json
            reports/edge-research-priority.json
            reports/edge-signal-darwinism.json
            reports/operational-truth-gate.json
            reports/forward-evidence-remote-sync.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Truthful Workflow Result
        if: always()
        env:
          ACQUISITION_HEALTH: ${{ steps.acquisition_health.outcome }}
          OPERATIONAL_TRUTH: ${{ steps.operational_truth.outcome }}
          FORWARD_EVIDENCE_SYNC: ${{ steps.forward_evidence_sync.outcome }}
          STATE_PACK: ${{ steps.state_pack.outcome }}
        run: |
          failed=0
          for check in ACQUISITION_HEALTH OPERATIONAL_TRUTH FORWARD_EVIDENCE_SYNC STATE_PACK; do
            value="${!check}"
            if [ "$value" != "success" ]; then
              echo "::error::$check finished with $value"
              failed=1
            fi
          done
          exit "$failed"
