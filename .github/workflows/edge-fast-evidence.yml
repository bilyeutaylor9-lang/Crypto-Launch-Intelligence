name: Edge Fast Evidence

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Live Dashboard"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: live-dashboard-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Restore Canonical Scanner State Bundle
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-${{ runner.os }}-

      - name: Restore Validated Scanner State
        run: npm run state:restore

      - name: Probe Tight-Window Fast Outcomes
        run: npm run edge:evidence:fast
        env:
          EDGE_FAST_EVIDENCE_MAX_REQUESTS: 30
          EDGE_FAST_EVIDENCE_CONCURRENCY: 4

      - name: Pack Canonical Scanner State Bundle
        if: always()
        id: state_pack
        continue-on-error: true
        run: npm run state:pack -- --require-exact-universe

      - name: Save Canonical Scanner State Bundle
        if: steps.state_pack.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Fast Evidence Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edge-fast-evidence-${{ github.run_id }}
          path: |
            reports/edge-fast-evidence-probe.json
          if-no-files-found: error
          retention-days: 14
