name: Crypto Launch Intelligence

on:
  push:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:
  intelligence-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Intelligence Scanner
        run: node src/index.js

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-reports
          path: reports/
