name: Qualification Proof Repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-proof-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Qualification Diagnostic Stack
        run: npm run test:qualification-stack

      - name: Produce Fresh Bounded Scan
        run: npm run scan:debug100
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          LIFI_API_KEY: ${{ secrets.LIFI_API_KEY }}
          LIFI_EXECUTION_RECOVERY_ENABLED: ${{ vars.LIFI_EXECUTION_RECOVERY_ENABLED || 'true' }}
          LIFI_INTEGRATOR: ${{ vars.LIFI_INTEGRATOR || 'crypto-launch-intel' }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          EXECUTION_QUOTE_TAKER_ADDRESS: ${{ vars.EXECUTION_QUOTE_TAKER_ADDRESS || '0x0000000000000000000000000000000000000001' }}

      - name: Build Qualification Failure Death Map
        run: npm run qualification:microscope

      - name: Refresh Only Recoverable Qualification Proof
        run: npm run qualification:repair
        env:
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          LIFI_API_KEY: ${{ secrets.LIFI_API_KEY }}
          LIFI_EXECUTION_RECOVERY_ENABLED: ${{ vars.LIFI_EXECUTION_RECOVERY_ENABLED || 'true' }}
          LIFI_INTEGRATOR: ${{ vars.LIFI_INTEGRATOR || 'crypto-launch-intel' }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          EXECUTION_QUOTE_TAKER_ADDRESS: ${{ vars.EXECUTION_QUOTE_TAKER_ADDRESS || '0x0000000000000000000000000000000000000001' }}
          USER_REGION: ${{ vars.USER_REGION }}
          USER_STATE: ${{ vars.USER_STATE }}
          QUALIFICATION_REPAIR_MAX_CANDIDATES: ${{ vars.QUALIFICATION_REPAIR_MAX_CANDIDATES || '25' }}

      - name: Upload Qualification Diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-proof-repair-${{ github.run_id }}
          path: |
            reports/qualification-failure-microscope.json
            reports/qualification-proof-repair.json
            reports/report.proof-repaired.json
          if-no-files-found: error
          retention-days: 30
