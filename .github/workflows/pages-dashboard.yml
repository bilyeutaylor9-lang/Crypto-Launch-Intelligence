name: Live Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-dashboard-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      scanner: ${{ steps.scanner.outcome }}
      qualification_microscope: ${{ steps.qualification_microscope.outcome }}
      engine_audit: ${{ steps.engine_audit.outcome }}
      readiness: ${{ steps.readiness.outcome }}
      semantic_health: ${{ steps.semantic_health.outcome }}
      report_contracts: ${{ steps.report_contracts.outcome }}
      dashboard_build: ${{ steps.dashboard_build.outcome }}
      reports_upload: ${{ steps.reports_upload.outcome }}
      dashboard_artifact: ${{ steps.dashboard_artifact.outcome }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Restore Bounded Learning Memory
        id: learning_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/*memory*.json*
            data/scan-history.json*
            data/market-opportunity-learning.json*
            data/outcome-snapshots.json*
            data/point-in-time-observations.json*
            data/project-observations.jsonl
            data/project-watchlist.json*
            data/research-coverage-ledger.json*
            data/source-router-memory.json*
            data/universe-ledger.json*
            data/watchtower-*.json*
            data/edge-production-episodes.jsonl
            data/edge-evidence-outcomes.jsonl
            data/committed-loaded-vacuum-observations.jsonl
            data/capital-commitment-episodes.jsonl
            data/capital-path-learning-observations.jsonl
            data/chain-capital-radar-observations.jsonl
            data/edge-candidate-universe.json
            data/prospective-entry-edge-episodes.jsonl
            data/native-discovery/raw-events.json
            data/native-discovery/confirmed-events.json
            data/native-discovery/checkpoints.json
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-${{ runner.os }}-

      - name: Run Intelligence Scanner
        id: scanner
        continue-on-error: true
        run: npm run scan:free-max
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          GITHUB_TOKEN: ${{ github.token }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          COINGECKO_API_TIER: ${{ vars.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_INCLUDE_COIN_LIST: ${{ vars.COINGECKO_INCLUDE_COIN_LIST || 'true' }}
          COINGECKO_COIN_LIST_LIMIT: ${{ vars.COINGECKO_COIN_LIST_LIMIT || '20000' }}
          EXCLUDE_MEME_CANDIDATES: ${{ vars.EXCLUDE_MEME_CANDIDATES || 'true' }}
          EXECUTION_RECOVERY_ENABLED: ${{ vars.EXECUTION_RECOVERY_ENABLED || 'true' }}
          EXECUTION_RECOVERY_MAX_CANDIDATES: ${{ vars.EXECUTION_RECOVERY_MAX_CANDIDATES || '25' }}
          EXECUTION_RECOVERY_TRADE_SIZES_USD: ${{ vars.EXECUTION_RECOVERY_TRADE_SIZES_USD || '100' }}
          LIFI_EXECUTION_RECOVERY_ENABLED: ${{ vars.LIFI_EXECUTION_RECOVERY_ENABLED || 'true' }}
          LIFI_API_KEY: ${{ secrets.LIFI_API_KEY }}
          LIFI_INTEGRATOR: ${{ vars.LIFI_INTEGRATOR || 'crypto-launch-intel' }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          EXECUTION_QUOTE_TAKER_ADDRESS: ${{ vars.EXECUTION_QUOTE_TAKER_ADDRESS || '0x0000000000000000000000000000000000000001' }}
          COINCAP_API_KEY: ${{ secrets.COINCAP_API_KEY }}
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
          DEXTOOLS_API_KEY: ${{ secrets.DEXTOOLS_API_KEY }}
          MESSARI_API_KEY: ${{ secrets.MESSARI_API_KEY }}
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          REDDIT_API_KEY: ${{ secrets.REDDIT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          ARBISCAN_API_KEY: ${{ secrets.ARBISCAN_API_KEY }}
          OPTIMISTIC_ETHERSCAN_API_KEY: ${{ secrets.OPTIMISTIC_ETHERSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          SNOWTRACE_API_KEY: ${{ secrets.SNOWTRACE_API_KEY }}
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
          DEBANK_API_KEY: ${{ secrets.DEBANK_API_KEY }}
          ZERION_API_KEY: ${{ secrets.ZERION_API_KEY }}
          TOKENSNIFFER_API_KEY: ${{ secrets.TOKENSNIFFER_API_KEY }}
          NATIVE_DISCOVERY_COLLECT: ${{ vars.NATIVE_DISCOVERY_COLLECT || 'true' }}
          NATIVE_EVENT_STORE_MAX_EVENTS: ${{ vars.NATIVE_EVENT_STORE_MAX_EVENTS || '25000' }}
          DISCOVERY_NATIVE_DISCOVERY_MESH_TIMEOUT_MS: ${{ vars.DISCOVERY_NATIVE_DISCOVERY_MESH_TIMEOUT_MS || '120000' }}
          NATIVE_DISCOVERY_CHAINS: ${{ vars.NATIVE_DISCOVERY_CHAINS || 'base,solana,bsc,polygon,arbitrum,ethereum,optimism,avalanche' }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          BASE_WS_URL: ${{ secrets.BASE_WS_URL }}
          IGNITION_RAW_SENSORS_ENABLED: ${{ vars.IGNITION_RAW_SENSORS_ENABLED || 'true' }}
          IGNITION_CHAIN_CAPITAL_RADAR_ENABLED: ${{ vars.IGNITION_CHAIN_CAPITAL_RADAR_ENABLED || 'true' }}
          IGNITION_RAW_SENSOR_MAX_PROJECTS: ${{ vars.IGNITION_RAW_SENSOR_MAX_PROJECTS || '8' }}
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          ETHEREUM_WS_URL: ${{ secrets.ETHEREUM_WS_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          BSC_WS_URL: ${{ secrets.BSC_WS_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          POLYGON_WS_URL: ${{ secrets.POLYGON_WS_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          ARBITRUM_WS_URL: ${{ secrets.ARBITRUM_WS_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          SOLANA_WS_URL: ${{ secrets.SOLANA_WS_URL }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          EVM_DEPLOYMENT_RADAR_RPC_URL: ${{ secrets.EVM_DEPLOYMENT_RADAR_RPC_URL }}
          BASE_AERODROME_FACTORY: ${{ secrets.BASE_AERODROME_FACTORY }}
          BASE_AERODROME_POOL_CREATED_TOPIC0: ${{ vars.BASE_AERODROME_POOL_CREATED_TOPIC0 }}
          BASE_AERODROME_SLIPSTREAM_FACTORY: ${{ secrets.BASE_AERODROME_SLIPSTREAM_FACTORY }}
          BASE_AERODROME_SLIPSTREAM_POOL_CREATED_TOPIC0: ${{ vars.BASE_AERODROME_SLIPSTREAM_POOL_CREATED_TOPIC0 }}
          BASE_UNISWAP_V3_FACTORY: ${{ secrets.BASE_UNISWAP_V3_FACTORY }}
          BASE_UNISWAP_V3_POOL_CREATED_TOPIC0: ${{ vars.BASE_UNISWAP_V3_POOL_CREATED_TOPIC0 }}
          BASE_UNISWAP_V4_POOL_MANAGER: ${{ secrets.BASE_UNISWAP_V4_POOL_MANAGER }}
          BASE_UNISWAP_V4_POOL_INITIALIZED_TOPIC0: ${{ vars.BASE_UNISWAP_V4_POOL_INITIALIZED_TOPIC0 }}
          BSC_PANCAKESWAP_V2_FACTORY: ${{ secrets.BSC_PANCAKESWAP_V2_FACTORY }}
          BSC_PANCAKESWAP_V2_POOL_CREATED_TOPIC0: ${{ vars.BSC_PANCAKESWAP_V2_POOL_CREATED_TOPIC0 }}
          BSC_PANCAKESWAP_V3_FACTORY: ${{ secrets.BSC_PANCAKESWAP_V3_FACTORY }}
          BSC_PANCAKESWAP_V3_POOL_CREATED_TOPIC0: ${{ vars.BSC_PANCAKESWAP_V3_POOL_CREATED_TOPIC0 }}
          POLYGON_QUICKSWAP_ALGEBRA_FACTORY: ${{ secrets.POLYGON_QUICKSWAP_ALGEBRA_FACTORY }}
          POLYGON_QUICKSWAP_ALGEBRA_POOL_CREATED_TOPIC0: ${{ vars.POLYGON_QUICKSWAP_ALGEBRA_POOL_CREATED_TOPIC0 }}
          ARBITRUM_CAMELOT_FACTORY: ${{ secrets.ARBITRUM_CAMELOT_FACTORY }}
          ARBITRUM_CAMELOT_POOL_CREATED_TOPIC0: ${{ vars.ARBITRUM_CAMELOT_POOL_CREATED_TOPIC0 }}
          SOLANA_PUMP_FUN_PROGRAM: ${{ secrets.SOLANA_PUMP_FUN_PROGRAM }}
          SOLANA_RAYDIUM_LAUNCHLAB_PROGRAM: ${{ secrets.SOLANA_RAYDIUM_LAUNCHLAB_PROGRAM }}
          SOLANA_RAYDIUM_CPMM_PROGRAM: ${{ secrets.SOLANA_RAYDIUM_CPMM_PROGRAM }}
          SOLANA_RAYDIUM_CLMM_PROGRAM: ${{ secrets.SOLANA_RAYDIUM_CLMM_PROGRAM }}
          SOLANA_METEORA_DBC_PROGRAM: ${{ secrets.SOLANA_METEORA_DBC_PROGRAM }}
          SOLANA_METEORA_DLMM_PROGRAM: ${{ secrets.SOLANA_METEORA_DLMM_PROGRAM }}
          SUPABASE_ENABLED: ${{ vars.SUPABASE_ENABLED || secrets.SUPABASE_ENABLED || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWKS_URL: ${{ secrets.SUPABASE_JWKS_URL }}
          SUPABASE_SYNC_ALPHA_RECEIPTS: ${{ vars.SUPABASE_SYNC_ALPHA_RECEIPTS || secrets.SUPABASE_SYNC_ALPHA_RECEIPTS || 'true' }}
          SUPABASE_SYNC_PROJECT_LIMIT: ${{ vars.SUPABASE_SYNC_PROJECT_LIMIT || secrets.SUPABASE_SYNC_PROJECT_LIMIT || '2500' }}

      - name: Diagnose Qualification Failure Funnel
        id: qualification_microscope
        if: always()
        continue-on-error: true
        run: npm run qualification:microscope

      - name: Save Bounded Learning Memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/*memory*.json*
            data/scan-history.json*
            data/market-opportunity-learning.json*
            data/outcome-snapshots.json*
            data/point-in-time-observations.json*
            data/project-observations.jsonl
            data/project-watchlist.json*
            data/research-coverage-ledger.json*
            data/source-router-memory.json*
            data/universe-ledger.json*
            data/watchtower-*.json*
            data/edge-production-episodes.jsonl
            data/edge-evidence-outcomes.jsonl
            data/committed-loaded-vacuum-observations.jsonl
            data/capital-commitment-episodes.jsonl
            data/capital-path-learning-observations.jsonl
            data/chain-capital-radar-observations.jsonl
            data/edge-candidate-universe.json
            data/prospective-entry-edge-episodes.jsonl
            data/native-discovery/raw-events.json
            data/native-discovery/confirmed-events.json
            data/native-discovery/checkpoints.json
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Run Full Engine Health Audit
        id: engine_audit
        if: always()
        continue-on-error: true
        run: npm run engine:audit:full

      - name: Refresh Master System Readiness
        id: readiness
        if: always()
        continue-on-error: true
        run: npm run system:readiness:refresh

      - name: Validate Scanner Semantic Health
        id: semantic_health
        if: always()
        continue-on-error: true
        run: npm run smoke:scanner

      - name: Validate Required Report Contracts
        id: report_contracts
        if: always()
        continue-on-error: true
        run: npm run results:health

      - name: Build Public Dashboard
        id: dashboard_build
        if: always()
        continue-on-error: true
        run: npm run publish:dashboard

      - name: Upload Scan Reports And Diagnostics
        id: reports_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: scan-reports-${{ github.run_id }}
          path: |
            reports/**
            data/**/*.json
            *.log
            npm-debug.log*
          if-no-files-found: ignore

      - name: Configure Pages
        if: always()
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Dashboard
        id: dashboard_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.dashboard_artifact == 'success'

    steps:
      - name: Deploy Dashboard
        id: deployment
        uses: actions/deploy-pages@v5

  health:
    name: Verify Scan And Deployment Health
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Enforce truthful final health
        env:
          SCANNER: ${{ needs.build.outputs.scanner }}
          QUALIFICATION_MICROSCOPE: ${{ needs.build.outputs.qualification_microscope }}
          ENGINE_AUDIT: ${{ needs.build.outputs.engine_audit }}
          READINESS: ${{ needs.build.outputs.readiness }}
          SEMANTIC_HEALTH: ${{ needs.build.outputs.semantic_health }}
          REPORT_CONTRACTS: ${{ needs.build.outputs.report_contracts }}
          DASHBOARD_BUILD: ${{ needs.build.outputs.dashboard_build }}
          REPORTS_UPLOAD: ${{ needs.build.outputs.reports_upload }}
          DASHBOARD_ARTIFACT: ${{ needs.build.outputs.dashboard_artifact }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          failed=0
          for check in SCANNER QUALIFICATION_MICROSCOPE ENGINE_AUDIT READINESS SEMANTIC_HEALTH REPORT_CONTRACTS DASHBOARD_BUILD REPORTS_UPLOAD DASHBOARD_ARTIFACT; do
            value="${!check}"
            if [ "$value" != "success" ]; then
              echo "::error::$check finished with $value"
              failed=1
            fi
          done
          if [ "$DEPLOY" != "success" ]; then
            echo "::error::DEPLOY finished with $DEPLOY"
            failed=1
          fi
          exit "$failed"
