name: CLI 5.0 Autonomous Alpha OS

on:
  workflow_dispatch:
  schedule:
    - cron: "12,42 * * * *"
  workflow_run:
    workflows: ["Shadow Universe Refresh"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: live-dashboard-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alpha-os:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      IGNITION_EXECUTABLE_QUOTE_ENDPOINT: ${{ secrets.IGNITION_EXECUTABLE_QUOTE_ENDPOINT }}
      IGNITION_EXECUTABLE_QUOTE_BEARER: ${{ secrets.IGNITION_EXECUTABLE_QUOTE_BEARER }}
      IGNITION_EXECUTABLE_QUOTE_PROVIDER: ${{ vars.IGNITION_EXECUTABLE_QUOTE_PROVIDER }}
      FORWARD_EXECUTION_COST_REFERENCE_NOTIONAL_USD: ${{ vars.FORWARD_EXECUTION_COST_REFERENCE_NOTIONAL_USD || '100' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_REMOTE_BACKUP_VERIFIED: ${{ vars.PRODUCTION_REMOTE_BACKUP_VERIFIED || 'false' }}
      PRODUCTION_REMOTE_BACKUP_PROVIDER: ${{ vars.PRODUCTION_REMOTE_BACKUP_PROVIDER }}
      PRODUCTION_REMOTE_BACKUP_VERIFIED_AT: ${{ vars.PRODUCTION_REMOTE_BACKUP_VERIFIED_AT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Restore Alpha OS Memory
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/edge-production-episodes.jsonl
            data/edge-evidence-outcomes.jsonl
            data/edge-fast-outcomes.jsonl
            data/edge-candidate-universe.json
            data/ignition-twin-observations.jsonl
            data/ignition-genome-history.json
            data/production-shadow-predictions.jsonl
            data/autonomous-alpha-experiments.json
            data/alpha-os-predictions.jsonl
            data/alpha-os-candidate-history.json
            data/capital-migration-history.json
            data/project-digital-twins.json
            data/model-factory-challengers.json
          key: alpha-os-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            alpha-os-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore Canonical Scanner State Bundle
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .state/scanner-learning-bundle.json.gz
          key: scanner-learning-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-learning-${{ runner.os }}-${{ github.ref_name }}-
            scanner-learning-${{ runner.os }}-

      - name: Restore Validated Scanner State
        run: npm run state:restore

      # Caches are only a performance layer. Alpha OS must obtain its exact
      # candidate universe from the most recent successful refresh artifact.
      - name: Restore Fresh Shadow Universe Refresh Artifact
        id: restore_fresh_universe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHADOW_REFRESH_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          SHADOW_REFRESH_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          refresh_run_id="$SHADOW_REFRESH_RUN_ID"
          if [ -z "$refresh_run_id" ]; then
            refresh_run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow shadow-universe-refresh.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$refresh_run_id"
          if [ -z "$SHADOW_REFRESH_HEAD_SHA" ]; then
            SHADOW_REFRESH_HEAD_SHA="$(gh run view "$refresh_run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha')"
          fi
          artifact_root="$RUNNER_TEMP/fresh-shadow-universe"
          mkdir -p "$artifact_root"
          gh run download "$refresh_run_id" --repo "$GITHUB_REPOSITORY" --name fresh-exact-shadow-universe --dir "$artifact_root"
          bundle="$(find "$artifact_root" -type f -name scanner-learning-bundle.json.gz -print -quit)"
          test -n "$bundle"
          mkdir -p .state
          cp "$bundle" .state/scanner-learning-bundle.json.gz
          printf 'refresh_run_id=%s\n' "$refresh_run_id" >> "$GITHUB_OUTPUT"
          printf 'refresh_head_sha=%s\n' "$SHADOW_REFRESH_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore Fresh Exact Shadow Universe State
        if: steps.restore_fresh_universe.outcome == 'success'
        run: npm run state:restore

      - name: Assert Fresh Exact Shadow Universe Handoff
        id: fresh_handoff
        if: steps.restore_fresh_universe.outcome == 'success'
        continue-on-error: true
        run: >-
          npm run shadow:handoff --
          --source=shadow-universe-refresh-artifact
          --refresh-workflow-run-id=${{ steps.restore_fresh_universe.outputs.refresh_run_id }}
          --refresh-workflow-head-sha=${{ steps.restore_fresh_universe.outputs.refresh_head_sha }}

      # A stale or unavailable artifact gets one bounded refresh attempt. The
      # same 90-minute truth gate is re-run below; this never lowers it.
      - name: Refresh Exact Candidate Universe Once When Handoff Is Invalid
        id: refresh_exact_universe
        if: steps.restore_fresh_universe.outcome != 'success' || steps.fresh_handoff.outcome != 'success'
        run: |
          npm run scan:debug100
          npm run state:pack -- --require-exact-universe

      - name: Assert Fresh Universe After Bounded Refresh
        if: steps.refresh_exact_universe.outcome == 'success'
        run: npm run shadow:handoff -- --source=direct-alpha-os-refresh --refresh-attempted

      - name: Restore Append-Only Forward Evidence
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            forward-evidence-${{ runner.os }}-${{ github.ref_name }}-
            forward-evidence-${{ runner.os }}-

      - name: Restore Durable Forward Evidence
        run: npm run forward:evidence:restore

      - name: Enforce Fresh Exact Shadow Universe
        id: exact_universe_truth
        run: npm run operations:truth -- --scope shadow-universe

      - name: Run Production Shadow
        run: npm run production:shadow

      - name: Run Autonomous Alpha OS
        run: npm run alpha:os

      - name: Learn From Mature Alpha OS Outcomes
        run: npm run alpha:os:learn

      - name: Grade Production Shadow
        run: npm run production:grade

      - name: Verify Forward Edge
        continue-on-error: true
        run: npm run edge:verify

      - name: Run Autonomous Alpha Lab
        run: npm run alpha:lab

      - name: Readiness Audit
        if: always()
        continue-on-error: true
        run: |
          set +e
          npm run production:ops-audit
          operational_audit_status=$?
          npm run production:readiness
          readiness_status=$?
          if [ "$operational_audit_status" -ne 0 ] || [ "$readiness_status" -ne 0 ]; then
            exit 2
          fi

      - name: Save Alpha OS Memory
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/alpha-os-predictions.jsonl
            data/alpha-os-candidate-history.json
            data/capital-migration-history.json
            data/project-digital-twins.json
            data/model-factory-challengers.json
            data/autonomous-alpha-experiments.json
            data/edge-candidate-universe.json
          key: alpha-os-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save Append-Only Forward Evidence
        if: ${{ always() && (hashFiles('data/production-market-observations.jsonl') != '' || hashFiles('data/market-context-observations.jsonl') != '' || hashFiles('data/prospective-edge-cohorts.jsonl') != '') }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            data/production-market-observations.jsonl
            data/market-context-observations.jsonl
            data/prospective-edge-cohorts.jsonl
          key: forward-evidence-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Sync Durable Forward Evidence
        if: always()
        run: npm run forward:evidence:sync

      - name: Upload Alpha OS Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-alpha-os-${{ github.run_id }}
          path: |
            reports/autonomous-alpha-os.json
            reports/digital-twin-changes.json
            reports/active-research-queue.json
            reports/alpha-os-resolved-outcomes.json
            reports/meta-learning-controller.json
            reports/model-factory-evaluation.json
            reports/alpha-attribution-forward.json
            reports/prospective-edge-cohort-capture.json
            reports/prospective-proof-acquisition.json
            reports/prospective-edge-cohort-grade.json
            reports/edge-verification-program.json
            reports/edge-verification-certificate.json
            reports/edge-verification-posthoc-diagnostic.json
            reports/autonomous-alpha-lab.json
            reports/production-readiness.json
            reports/remote-backup-attestation.json
            reports/production-security-audit.json
            reports/data-source-readiness.json
            reports/fresh-shadow-universe-handoff.json
            reports/operational-truth-gate.json
            reports/scanner-state-restore.json
            reports/scanner-state-bundle.json
            reports/forward-evidence-restore.json
            reports/forward-evidence-sync.json
            reports/forward-evidence-verify.json
            reports/forward-evidence-reconciliation.json
          if-no-files-found: warn
          retention-days: 60
